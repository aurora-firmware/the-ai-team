<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FB923C"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FACC15"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60A5FA"/></marker><marker id="m-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker><marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <style><![CDATA[
      .bg    { fill: #0B1120; stroke: #1E293B; stroke-width: 1.5; }
      .panel { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; }
      .title { font-weight: 700; font-size: 28px; fill: #F8FAFC; letter-spacing: -0.4px; }
      .sub   { font-size: 15px; fill: #94A3B8; }
      .ph    { font-weight: 700; font-size: 17px; fill: #F8FAFC; }
      .h     { font-weight: 700; font-size: 14px; fill: #F8FAFC; }
      .t     { font-size: 12px; fill: #CBD5E1; }
      .s     { font-size: 12px; fill: #94A3B8; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card  { fill: #111827; stroke-width: 1.6; }
      .ln    { fill: none; stroke: #64748B; stroke-width: 1.6; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect class="bg" x="1" y="1" width="1118" height="358" rx="18"/>
  <g class="n d1"><text class="title" x="560" y="52" text-anchor="middle">Five gates between an idea and main</text>
  <text class="sub" x="560" y="80" text-anchor="middle">The Product Owner decides at Gate 1 and Gate 5. Gates 2 to 4 run without them.</text></g>
<g class="n d2"><rect x="270" y="120" width="600" height="210" rx="16" fill="none" stroke="#334155" stroke-width="1.5" class="ants"/><text xml:space="preserve" class="s" x="570" y="145" text-anchor="middle" letter-spacing=".4">AUTOMATED · inside planning and the loops</text></g>
<g class="e d2"><line x1="40" y1="230" x2="1076" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#m-g)"/></g>
<g class="n d2"><text xml:space="preserve" class="s" x="40" y="262" text-anchor="start">feature request</text></g>
<g class="n d2"><text xml:space="preserve" class="s mono" x="1080" y="262" text-anchor="end">main</text></g>
<g class="n d3"><text xml:space="preserve" class="h" x="180" y="182" text-anchor="middle">Spec approval</text><circle cx="180" cy="230" r="32" fill="#3B3824" stroke="#FACC15" stroke-width="2"/><circle class="pulse" cx="180" cy="230" r="40" fill="none" stroke="#FACC15" stroke-opacity=".45" stroke-width="1.5"/><text xml:space="preserve" class="h" x="180" y="238" text-anchor="middle" font-size="22">1</text><text xml:space="preserve" class="t" x="180" y="290" text-anchor="middle" fill="#FACC15">Product Owner</text><text xml:space="preserve" class="s" x="180" y="308" text-anchor="middle">approved spec</text></g>
<g class="n d4"><text xml:space="preserve" class="h" x="375" y="182" text-anchor="middle">Task plan preflight</text><circle cx="375" cy="230" r="32" fill="#1F314D" stroke="#60A5FA" stroke-width="2"/><text xml:space="preserve" class="h" x="375" y="238" text-anchor="middle" font-size="22">2</text><text xml:space="preserve" class="t" x="375" y="290" text-anchor="middle" fill="#60A5FA">Architect</text><text xml:space="preserve" class="s" x="375" y="308" text-anchor="middle">ready task queue</text></g>
<g class="n d5"><text xml:space="preserve" class="h" x="570" y="182" text-anchor="middle">Code review</text><circle cx="570" cy="230" r="32" fill="#3A2841" stroke="#F472B6" stroke-width="2"/><text xml:space="preserve" class="h" x="570" y="238" text-anchor="middle" font-size="22">3</text><text xml:space="preserve" class="t" x="570" y="290" text-anchor="middle" fill="#F472B6">Reviewer</text><text xml:space="preserve" class="s" x="570" y="308" text-anchor="middle">PASS · FAIL · ESCALATE</text></g>
<g class="n d6"><text xml:space="preserve" class="h" x="765" y="182" text-anchor="middle">Integration tests</text><circle cx="765" cy="230" r="32" fill="#173A3C" stroke="#34D399" stroke-width="2"/><text xml:space="preserve" class="h" x="765" y="238" text-anchor="middle" font-size="22">4</text><text xml:space="preserve" class="t" x="765" y="290" text-anchor="middle" fill="#34D399">Integration procedure</text><text xml:space="preserve" class="s" x="765" y="308" text-anchor="middle">merged, tests pass</text></g>
<g class="n d7"><text xml:space="preserve" class="h" x="960" y="182" text-anchor="middle">Final sign-off</text><circle cx="960" cy="230" r="32" fill="#3B3824" stroke="#FACC15" stroke-width="2"/><circle class="pulse" cx="960" cy="230" r="40" fill="none" stroke="#FACC15" stroke-opacity=".45" stroke-width="1.5"/><text xml:space="preserve" class="h" x="960" y="238" text-anchor="middle" font-size="22">5</text><text xml:space="preserve" class="t" x="960" y="290" text-anchor="middle" fill="#FACC15">Product Owner</text><text xml:space="preserve" class="s" x="960" y="308" text-anchor="middle">dev-agent → main</text></g>
</svg>
