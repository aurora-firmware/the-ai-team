<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 464" width="1120" height="464" font-family="'AF Sans', sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E63B26"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#F7941D"/></linearGradient>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F4695A"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22C55E"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FABA6A"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F7941D"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker>
    <style><![CDATA[
      @font-face { font-family: 'AF Display'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'AF Sans'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'AF Sans'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }

      .title { font-family: 'AF Display', sans-serif; font-size: 28px; fill: #FFFFFF; }
      .role  { font-family: 'AF Display', sans-serif; font-size: 13px; letter-spacing: .3px; }
      .num   { font-family: 'AF Display', sans-serif; font-size: 21px; fill: #FFFFFF; }
      .sub   { font-size: 18px; fill: #9CA3AF; }
      .ph    { font-weight: 600; font-size: 19px; fill: #FFFFFF; }
      .h     { font-weight: 600; font-size: 16px; fill: #FFFFFF; }
      .t     { font-size: 14.5px; fill: #D8DAE8; }
      .s     { font-size: 14px; fill: #9CA3AF; }
      .cap   { font-size: 11.5px; letter-spacing: 1.5px; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .sys   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect x="1" y="1" width="1118" height="462" rx="18" fill="#080A24" stroke="#2E3372" stroke-width="1.5"/>
  <g class="n d1"><text xml:space="preserve" class="title" x="560" y="54" text-anchor="middle">Blocked work climbs a short ladder</text><rect x="490" y="70" width="140" height="3" rx="1.5" fill="url(#brand)"/><text xml:space="preserve" class="sub" x="560" y="100" text-anchor="middle">Self-recovery first, then one Architect consultation, then the Product Owner decides.</text></g>
  <g transform="translate(0 24)">
<g class="n d2">
<rect x="60" y="230" width="300" height="90" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="74" y="230" width="272" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="h" x="210.0" y="272.0" text-anchor="middle" fill="#FFFFFF">1 · Role self-recovery</text>
<text xml:space="preserve" class="s" x="210.0" y="290.0" text-anchor="middle">retries within its own threshold</text>
</g>
<g class="n d4">
<rect x="410" y="170" width="300" height="90" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="424" y="170" width="272" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="h" x="560.0" y="212.0" text-anchor="middle" fill="#FFFFFF">2 · Architect consultation</text>
<text xml:space="preserve" class="s" x="560.0" y="230.0" text-anchor="middle">one attempt · escalation-review</text>
</g>
<g class="n d6">
<rect x="760" y="110" width="300" height="90" rx="10" fill="#1A1E4A" stroke="url(#brand)" stroke-width="2"/>
<text xml:space="preserve" class="h" x="910.0" y="152.0" text-anchor="middle" fill="#FFFFFF">3 · Product Owner</text>
<text xml:space="preserve" class="s" x="910.0" y="170.0" text-anchor="middle">decides the next action</text>
</g>
<g class="e d3"><path d="M361,262 H385 V215 H407" fill="none" stroke="#FABA6A" stroke-width="1.6" marker-end="url(#m-o)"/></g>
<g class="n d3"><text xml:space="preserve" class="s" x="393" y="284" text-anchor="start" fill="#FABA6A">threshold</text></g>
<g class="n d3"><text xml:space="preserve" class="s" x="393" y="299" text-anchor="start" fill="#FABA6A">exceeded</text></g>
<g class="e d5"><path d="M711,202 H735 V155 H757" fill="none" stroke="#FABA6A" stroke-width="1.6" marker-end="url(#m-o)"/></g>
<g class="n d5"><text xml:space="preserve" class="s" x="743" y="224" text-anchor="start" fill="#FABA6A">not</text></g>
<g class="n d5"><text xml:space="preserve" class="s" x="743" y="239" text-anchor="start" fill="#FABA6A">resolved</text></g>
<g class="e d7"><path d="M560,261 C560,360 220,370 210,324" fill="none" stroke="#22C55E" stroke-width="1.6" marker-end="url(#m-ok)" class="flow"/></g>
<g class="n d7"><text xml:space="preserve" class="t" x="400" y="368" text-anchor="middle" fill="#22C55E">resolved <tspan class="sys">→</tspan> the role continues</text></g>
<g class="n d8"><text xml:space="preserve" class="s" x="560" y="412" text-anchor="middle">Thresholds:  Developer, 3 failed attempts  |  Reviewer, ESCALATE or 3 review cycles  |  Integrator, 1 merge attempt</text></g>
  </g>
</svg>
