<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FB923C"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FACC15"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60A5FA"/></marker><marker id="m-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker><marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <style><![CDATA[
      .bg    { fill: #0B1120; stroke: #1E293B; stroke-width: 1.5; }
      .panel { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; }
      .title { font-weight: 700; font-size: 28px; fill: #F8FAFC; letter-spacing: -0.4px; }
      .sub   { font-size: 15px; fill: #94A3B8; }
      .ph    { font-weight: 700; font-size: 17px; fill: #F8FAFC; }
      .h     { font-weight: 700; font-size: 14px; fill: #F8FAFC; }
      .t     { font-size: 12px; fill: #CBD5E1; }
      .s     { font-size: 12px; fill: #94A3B8; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card  { fill: #111827; stroke-width: 1.6; }
      .ln    { fill: none; stroke: #64748B; stroke-width: 1.6; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect class="bg" x="1" y="1" width="1118" height="438" rx="18"/>
  <g class="n d1"><text class="title" x="560" y="52" text-anchor="middle">Blocked work climbs a short ladder</text>
  <text class="sub" x="560" y="80" text-anchor="middle">Self-recovery first, then one Architect consultation, then the Product Owner decides.</text></g>
<g class="n d2">
<rect class="card" x="60" y="230" width="300" height="90" rx="10" stroke="#22D3EE" fill="#132B3B"/>
<text xml:space="preserve" class="h" x="210.0" y="272.0" text-anchor="middle">1 · Role self-recovery</text>
<text xml:space="preserve" class="t" x="210.0" y="289.0" text-anchor="middle">retries within its own threshold</text>
</g>
<g class="n d4">
<rect class="card" x="410" y="170" width="300" height="90" rx="10" stroke="#60A5FA" fill="#19263C"/>
<text xml:space="preserve" class="h" x="560.0" y="212.0" text-anchor="middle">2 · Architect consultation</text>
<text xml:space="preserve" class="t" x="560.0" y="229.0" text-anchor="middle">one attempt · escalation-review</text>
</g>
<g class="n d6">
<rect class="card" x="760" y="110" width="300" height="90" rx="10" stroke="#FACC15" fill="#282A25"/>
<text xml:space="preserve" class="h" x="910.0" y="152.0" text-anchor="middle">3 · Product Owner</text>
<text xml:space="preserve" class="t" x="910.0" y="169.0" text-anchor="middle">decides the next action</text>
</g>
<g class="e d3"><path d="M361,262 H385 V215 H407" fill="none" stroke="#FB923C" stroke-width="1.6" marker-end="url(#m-o)"/></g>
<g class="n d3"><text xml:space="preserve" class="s" x="393" y="284" text-anchor="start" fill="#FB923C">threshold</text></g>
<g class="n d3"><text xml:space="preserve" class="s" x="393" y="299" text-anchor="start" fill="#FB923C">exceeded</text></g>
<g class="e d5"><path d="M711,202 H735 V155 H757" fill="none" stroke="#FB923C" stroke-width="1.6" marker-end="url(#m-o)"/></g>
<g class="n d5"><text xml:space="preserve" class="s" x="743" y="224" text-anchor="start" fill="#FB923C">not</text></g>
<g class="n d5"><text xml:space="preserve" class="s" x="743" y="239" text-anchor="start" fill="#FB923C">resolved</text></g>
<g class="e d7"><path d="M560,261 C560,360 220,370 210,324" fill="none" stroke="#34D399" stroke-width="1.6" marker-end="url(#m-ok)" class="flow"/></g>
<g class="n d7"><text xml:space="preserve" class="t" x="400" y="368" text-anchor="middle" fill="#34D399">resolved → the role continues</text></g>
<g class="n d8"><text xml:space="preserve" class="s" x="560" y="412" text-anchor="middle">Thresholds:  Developer, 3 failed attempts  |  Reviewer, ESCALATE or 3 review cycles  |  Integrator, 1 merge attempt</text></g>
</svg>
