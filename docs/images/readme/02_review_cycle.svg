<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FB923C"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FACC15"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60A5FA"/></marker><marker id="m-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker><marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <style><![CDATA[
      .bg    { fill: #0B1120; stroke: #1E293B; stroke-width: 1.5; }
      .panel { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; }
      .title { font-weight: 700; font-size: 28px; fill: #F8FAFC; letter-spacing: -0.4px; }
      .sub   { font-size: 15px; fill: #94A3B8; }
      .ph    { font-weight: 700; font-size: 17px; fill: #F8FAFC; }
      .h     { font-weight: 700; font-size: 14px; fill: #F8FAFC; }
      .t     { font-size: 12px; fill: #CBD5E1; }
      .s     { font-size: 12px; fill: #94A3B8; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card  { fill: #111827; stroke-width: 1.6; }
      .ln    { fill: none; stroke: #64748B; stroke-width: 1.6; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect class="bg" x="1" y="1" width="1118" height="458" rx="18"/>
  <g class="n d1"><text class="title" x="560" y="52" text-anchor="middle">Every task earns its merge</text>
  <text class="sub" x="560" y="80" text-anchor="middle">Developer → Reviewer → integration, repeated until the Reviewer passes the work.</text></g>
<g class="n d2">
<rect class="card" x="40" y="170" width="160" height="90" rx="10" stroke="#64748B" fill="#192131"/>
<text xml:space="preserve" class="h" x="120.0" y="212.0" text-anchor="middle">Pending task</text>
<text xml:space="preserve" class="t" x="120.0" y="229.0" text-anchor="middle">local tracker</text>
</g>
<g class="n d3">
<rect class="card" x="240" y="170" width="200" height="90" rx="10" stroke="#22D3EE" fill="#132B3B"/>
<text xml:space="preserve" class="h" x="340.0" y="212.0" text-anchor="middle">Developer</text>
<text xml:space="preserve" class="t" x="340.0" y="229.0" text-anchor="middle">task branch · TDD</text>
</g>
<g class="n d4">
<rect class="card" x="480" y="170" width="200" height="90" rx="10" stroke="#F472B6" fill="#282135"/>
<text xml:space="preserve" class="h" x="580.0" y="212.0" text-anchor="middle">Reviewer</text>
<text xml:space="preserve" class="t" x="580.0" y="229.0" text-anchor="middle">Gate 3 · two-stage review</text>
</g>
<g class="n d5">
<rect class="card" x="720" y="170" width="200" height="90" rx="10" stroke="#34D399" fill="#142B32"/>
<text xml:space="preserve" class="h" x="820.0" y="212.0" text-anchor="middle">Integration</text>
<text xml:space="preserve" class="t" x="820.0" y="229.0" text-anchor="middle">Gate 4 · merge into dev-agent</text>
</g>
<g class="n d6">
<rect class="card" x="960" y="170" width="120" height="90" rx="10" stroke="#34D399" fill="#142B32"/>
<text xml:space="preserve" class="h mono" x="1020.0" y="212.0" text-anchor="middle">completed</text>
<text xml:space="preserve" class="t" x="1020.0" y="229.0" text-anchor="middle">tests pass</text>
</g>
<g class="e d3"><path d="M201,215 H237" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d4"><path d="M441,215 H477" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d5"><path d="M681,215 H717" fill="none" stroke="#34D399" stroke-width="1.6" marker-end="url(#m-ok)"/></g>
<g class="n d5"><text xml:space="preserve" class="s" x="699" y="206" text-anchor="middle" fill="#34D399">PASS</text></g>
<g class="e d6"><path d="M921,215 H957" fill="none" stroke="#34D399" stroke-width="1.6" marker-end="url(#m-ok)"/></g>
<g class="e d7"><path d="M580,169 C580,108 340,108 340,166" fill="none" stroke="#F87171" stroke-width="2" marker-end="url(#m-r)" class="flow"/></g>
<g class="n d7"><text xml:space="preserve" class="t" x="460" y="112" text-anchor="middle" fill="#F87171">FAIL · Developer answers every finding</text></g>
<g class="e d8"><path d="M580,261 V327" fill="none" stroke="#FB923C" stroke-width="1.6" marker-end="url(#m-o)"/></g>
<g class="n d8"><text xml:space="preserve" class="s" x="588" y="300" text-anchor="start" fill="#FB923C">ESCALATE, or a 3rd FAIL</text></g>
<g class="n d8">
<rect class="card" x="480" y="330" width="200" height="56" rx="10" stroke="#FB923C" fill="#282429"/>
<text xml:space="preserve" class="h" x="580.0" y="355.0" text-anchor="middle">Architect</text>
<text xml:space="preserve" class="t" x="580.0" y="372.0" text-anchor="middle">guidance, or Product Owner</text>
</g>
<g class="e d9"><path d="M820,261 V327" fill="none" stroke="#F87171" stroke-width="1.6" marker-end="url(#m-r)"/></g>
<g class="n d9"><text xml:space="preserve" class="s" x="828" y="300" text-anchor="start" fill="#F87171">regression</text></g>
<g class="n d9">
<rect class="card" x="720" y="330" width="200" height="56" rx="10" stroke="#F87171" fill="#28212E"/>
<text xml:space="preserve" class="h" x="820.0" y="355.0" text-anchor="middle">Open bug</text>
<text xml:space="preserve" class="t mono" x="820.0" y="372.0" text-anchor="middle">→ /bug-loop</text>
</g>
<g class="n d10"><text xml:space="preserve" class="s" x="560" y="430" text-anchor="middle">The loop takes the next pending task until the queue is empty, a task is blocked, or escalation is needed.</text></g>
</svg>
