<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 434" width="1120" height="434" font-family="'AF Sans', sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E63B26"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#F7941D"/></linearGradient>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F4695A"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22C55E"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FABA6A"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F7941D"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker>
    <style><![CDATA[
      @font-face { font-family: 'AF Display'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'AF Sans'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'AF Sans'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }

      .title { font-family: 'AF Display', sans-serif; font-size: 26px; fill: #FFFFFF; }
      .role  { font-family: 'AF Display', sans-serif; font-size: 12px; letter-spacing: .3px; }
      .num   { font-family: 'AF Display', sans-serif; font-size: 20px; fill: #FFFFFF; }
      .sub   { font-size: 17px; fill: #9CA3AF; }
      .ph    { font-weight: 600; font-size: 18px; fill: #FFFFFF; }
      .h     { font-weight: 600; font-size: 15px; fill: #FFFFFF; }
      .t     { font-size: 13.5px; fill: #D8DAE8; }
      .s     { font-size: 13px; fill: #9CA3AF; }
      .cap   { font-size: 11px; letter-spacing: 1.5px; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .sys   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect x="1" y="1" width="1118" height="432" rx="18" fill="#080A24" stroke="#2E3372" stroke-width="1.5"/>
  <g class="n d1"><text xml:space="preserve" class="title" x="560" y="54" text-anchor="middle">Rules first, implementation second</text><rect x="490" y="70" width="140" height="3" rx="1.5" fill="url(#brand)"/><text xml:space="preserve" class="sub" x="560" y="100" text-anchor="middle">ai-process/ decides. Agents and skills carry it out faithfully.</text></g>
  <g transform="translate(0 24)">
<g class="n d2"><rect x="40" y="110" width="440" height="230" rx="14" fill="#0F1340" stroke="#2E3372" stroke-width="1.5"/><text xml:space="preserve" class="ph" x="260.0" y="142" text-anchor="middle">ai-process/</text><text xml:space="preserve" class="s" x="260.0" y="162" text-anchor="middle">specification layer · the single source of truth</text></g>
<g class="n d3"><rect x="60" y="180" width="400" height="40" rx="8" fill="#1A1E4A" stroke="#F7941D" stroke-opacity=".8" stroke-width="1.5"/><text xml:space="preserve" class="h" x="78" y="205" text-anchor="start">Workflows</text><text xml:space="preserve" class="t mono" x="442" y="205" text-anchor="end">processes/</text></g>
<g class="n d4"><rect x="60" y="230" width="400" height="40" rx="8" fill="#1A1E4A" stroke="#F7941D" stroke-opacity=".8" stroke-width="1.5"/><text xml:space="preserve" class="h" x="78" y="255" text-anchor="start">Standards</text><text xml:space="preserve" class="t mono" x="442" y="255" text-anchor="end">guidelines/</text></g>
<g class="n d5"><rect x="60" y="280" width="400" height="40" rx="8" fill="#1A1E4A" stroke="#F7941D" stroke-opacity=".8" stroke-width="1.5"/><text xml:space="preserve" class="h" x="78" y="305" text-anchor="start">Structure</text><text xml:space="preserve" class="t mono" x="442" y="305" text-anchor="end">architecture/</text></g>
<g class="n d6"><rect x="640" y="110" width="440" height="230" rx="14" fill="#0F1340" stroke="#2E3372" stroke-width="1.5"/><text xml:space="preserve" class="ph" x="860.0" y="142" text-anchor="middle">cli/src/ai_team/init/sources/</text><text xml:space="preserve" class="s" x="860.0" y="162" text-anchor="middle">implementation layer · exported by ai-team init</text></g>
<g class="n d7"><rect x="660" y="180" width="400" height="40" rx="8" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/><text xml:space="preserve" class="h" x="678" y="205" text-anchor="start">Agents</text><text xml:space="preserve" class="t mono" x="1042" y="205" text-anchor="end">agents/*.md</text></g>
<g class="n d8"><rect x="660" y="230" width="400" height="40" rx="8" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/><text xml:space="preserve" class="h" x="678" y="255" text-anchor="start">Skills</text><text xml:space="preserve" class="t mono" x="1042" y="255" text-anchor="end">skills/&lt;name&gt;/SKILL.md</text></g>
<g class="n d9"><rect x="660" y="280" width="400" height="40" rx="8" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/><text xml:space="preserve" class="h" x="678" y="305" text-anchor="start">Project skeleton</text><text xml:space="preserve" class="t mono" x="1042" y="305" text-anchor="end">project/ · root/</text></g>
<g class="e d6"><path d="M482,200 H636" fill="none" stroke="#F7941D" stroke-width="2" marker-end="url(#m-y)" class="flow"/></g>
<g class="n d6"><text xml:space="preserve" class="t" x="560" y="190" text-anchor="middle" fill="#F7941D">dictates</text></g>
<g class="e d10"><path d="M638,260 H486" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)" stroke-dasharray="5 4"/></g>
<g class="n d10"><text xml:space="preserve" class="s" x="560" y="284" text-anchor="middle">checked against</text></g>
<g class="n d11"><text xml:space="preserve" class="s" x="560" y="380" text-anchor="middle">Change a rule in ai-process/ first, then update the agents and skills that implement it. Never let them contradict each other.</text></g>
  </g>
</svg>
