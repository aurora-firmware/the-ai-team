<text xml:space="preserve" class="h" x="163.0" y="496.0" text-anchor="middle">Task breakdown</text>
<text xml:space="preserve" class="t" x="163.0" y="513.0" text-anchor="middle">Planner · atomic tasks</text>
</g>
<g class="e d7"><path d="M163,523 V548" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
