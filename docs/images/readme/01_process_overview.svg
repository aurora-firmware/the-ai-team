<text xml:space="preserve" class="t" x="615.0" y="397.0" text-anchor="middle">Gate 3 · two-stage review</text>
</g>
<g class="e d11"><path d="M615,407 V446" fill="none" stroke="#34D399" stroke-width="1.6" marker-end="url(#m-ok)"/></g>
