<text xml:space="preserve" class="t" x="615.0" y="487.0" text-anchor="middle">Gate 4 · merge + full test suite</text>
</g>
<g class="n d11"><text xml:space="preserve" class="s" x="628" y="437" text-anchor="start" fill="#34D399">PASS</text></g>
<g class="e d11"><path d="M509,383 H486 V293 H507" fill="none" stroke="#F87171" stroke-width="1.6" marker-end="url(#m-r)" class="flow"/></g>
<g class="n d11"><text class="s" x="478" y="338" text-anchor="middle" fill="#F87171" transform="rotate(-90 478 338)">FAIL</text></g>
<g class="e d12"><path d="M721,463 H752 V213 H723" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)" class="flow"/></g>
<g class="n d12"><text class="s" x="766" y="338" text-anchor="middle" transform="rotate(-90 766 338)">next task</text></g>
<g class="n d12"><text xml:space="preserve" class="s" x="615" y="548" text-anchor="middle">Stops on: empty queue · blocked task · escalation</text><text xml:space="preserve" class="s" x="615" y="568" text-anchor="middle">Up to 3 review cycles, then the Architect is consulted</text></g>
<g class="e d12"><path d="M721,190 H850" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d12"><text xml:space="preserve" class="s" x="726" y="182" text-anchor="start">queue empty</text></g>
<g class="e d12"><path d="M721,485 H800 V437 H850" fill="none" stroke="#F87171" stroke-width="1.6" marker-end="url(#m-r)"/></g>
<g class="n d12"><text xml:space="preserve" class="s" x="726" y="503" text-anchor="start" fill="#F87171">regression</text></g>
<g class="n d10">
<rect class="card" x="853" y="176" width="204" height="36" rx="10" stroke="#60A5FA" fill="#19263C"/>
