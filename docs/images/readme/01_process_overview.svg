<text xml:space="preserve" class="t" x="615.0" y="307.0" text-anchor="middle">implements · TDD</text>
</g>
<g class="e d10"><path d="M615,317 V356" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
