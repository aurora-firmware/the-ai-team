<text xml:space="preserve" class="t" x="163.0" y="439.0" text-anchor="middle">Architect · ADRs</text>
</g>
<g class="e d6"><path d="M163,449 V474" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
