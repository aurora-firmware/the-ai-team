<text xml:space="preserve" class="h" x="163.0" y="348.0" text-anchor="middle">Gate 1</text>
<text xml:space="preserve" class="t" x="163.0" y="365.0" text-anchor="middle">Product Owner approves the spec</text>
</g>
<g class="e d5"><path d="M163,375 V400" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d5">
