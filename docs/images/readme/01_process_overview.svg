<g class="n d12">
<rect class="card" x="853" y="276" width="204" height="44" rx="10" stroke="#FACC15" fill="#282A25" stroke-dasharray="5 4"/>
<text xml:space="preserve" class="h" x="955.0" y="295.0" text-anchor="middle">Gate 5 · Product Owner</text>
<text xml:space="preserve" class="t" x="955.0" y="312.0" text-anchor="middle">approves dev-agent → main</text>
</g>
<g class="n d9">
<rect class="card" x="853" y="420" width="204" height="34" rx="10" stroke="#22D3EE" fill="#132B3B"/>
