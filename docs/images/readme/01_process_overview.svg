<text xml:space="preserve" class="t" x="163.0" y="587.0" text-anchor="middle">Architect preflights the task plan</text>
</g>
<g class="n d3">
<rect class="card" x="292" y="254" width="104" height="46" rx="10" stroke="#64748B" fill="#192131" stroke-dasharray="5 4"/>
