<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FB923C"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FACC15"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60A5FA"/></marker><marker id="m-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker><marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <style><![CDATA[
      .bg    { fill: #0B1120; stroke: #1E293B; stroke-width: 1.5; }
      .panel { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; }
      .title { font-weight: 700; font-size: 28px; fill: #F8FAFC; letter-spacing: -0.4px; }
      .sub   { font-size: 15px; fill: #94A3B8; }
      .ph    { font-weight: 700; font-size: 17px; fill: #F8FAFC; }
      .h     { font-weight: 700; font-size: 14px; fill: #F8FAFC; }
      .t     { font-size: 12px; fill: #CBD5E1; }
      .s     { font-size: 12px; fill: #94A3B8; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card  { fill: #111827; stroke-width: 1.6; }
      .ln    { fill: none; stroke: #64748B; stroke-width: 1.6; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect class="bg" x="1" y="1" width="1118" height="378" rx="18"/>
  <g class="n d1"><text class="title" x="560" y="52" text-anchor="middle">You approve twice. The agents do the rest.</text>
  <text class="sub" x="560" y="80" text-anchor="middle">Two product-owner gates. Everything between them runs on its own.</text></g>
<g class="n d2">
<rect class="card" x="30" y="190" width="140" height="60" rx="10" stroke="#FACC15" fill="#282A25"/>
<text xml:space="preserve" class="h" x="100.0" y="217.0" text-anchor="middle">Product Owner</text>
<text xml:space="preserve" class="t" x="100.0" y="234.0" text-anchor="middle">feature request</text>
</g>
<g class="n d3"><circle cx="235" cy="220" r="32" fill="#363524" stroke="#FACC15" stroke-width="2"/><circle class="pulse" cx="235" cy="220" r="38" fill="none" stroke="#FACC15" stroke-opacity=".45" stroke-width="1.5"/><text xml:space="preserve" class="s" x="235" y="215" text-anchor="middle" fill="#FACC15">GATE</text><text xml:space="preserve" class="h" x="235" y="234" text-anchor="middle" font-size="18">1</text><text xml:space="preserve" class="s" x="235" y="280" text-anchor="middle">approve spec</text></g>
<g class="n d9"><circle cx="890" cy="220" r="32" fill="#363524" stroke="#FACC15" stroke-width="2"/><circle class="pulse" cx="890" cy="220" r="38" fill="none" stroke="#FACC15" stroke-opacity=".45" stroke-width="1.5"/><text xml:space="preserve" class="s" x="890" y="215" text-anchor="middle" fill="#FACC15">GATE</text><text xml:space="preserve" class="h" x="890" y="234" text-anchor="middle" font-size="18">5</text><text xml:space="preserve" class="s" x="890" y="280" text-anchor="middle">approve merge</text></g>
<g class="n d4"><rect x="290" y="140" width="555" height="160" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" class="ants"/><text xml:space="preserve" class="s" x="567" y="166" text-anchor="middle" letter-spacing=".4">AUTONOMOUS · agents stop and ask only when the rules say they must</text></g>
<g class="n d5">
<rect class="card" x="305" y="192" width="96" height="56" rx="10" stroke="#A78BFA" fill="#20243C"/>
<text xml:space="preserve" class="h" x="353.0" y="225.0" text-anchor="middle">Planner</text>
</g>
<g class="n d5"><text xml:space="preserve" class="s" x="353" y="270" text-anchor="middle">spec + tasks</text></g>
<g class="e d6"><path d="M402,220 H415" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d5">
<rect class="card" x="415" y="192" width="96" height="56" rx="10" stroke="#60A5FA" fill="#19263C"/>
<text xml:space="preserve" class="h" x="463.0" y="225.0" text-anchor="middle">Architect</text>
</g>
<g class="n d5"><text xml:space="preserve" class="s" x="463" y="270" text-anchor="middle">design · Gate 2</text></g>
<g class="e d6"><path d="M512,220 H525" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d6">
<rect class="card" x="525" y="192" width="96" height="56" rx="10" stroke="#22D3EE" fill="#132B3B"/>
<text xml:space="preserve" class="h" x="573.0" y="225.0" text-anchor="middle">Developer</text>
</g>
<g class="n d6"><text xml:space="preserve" class="s" x="573" y="270" text-anchor="middle">builds · TDD</text></g>
<g class="e d6"><path d="M622,220 H635" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d6">
<rect class="card" x="635" y="192" width="96" height="56" rx="10" stroke="#F472B6" fill="#282135"/>
<text xml:space="preserve" class="h" x="683.0" y="225.0" text-anchor="middle">Reviewer</text>
</g>
<g class="n d6"><text xml:space="preserve" class="s" x="683" y="270" text-anchor="middle">Gate 3</text></g>
<g class="e d6"><path d="M732,220 H745" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d7">
<rect class="card" x="745" y="192" width="96" height="56" rx="10" stroke="#34D399" fill="#142B32"/>
<text xml:space="preserve" class="h" x="793.0" y="225.0" text-anchor="middle">Integration</text>
</g>
<g class="n d7"><text xml:space="preserve" class="s" x="793" y="270" text-anchor="middle">Gate 4</text></g>
<g class="n d10">
<rect class="card" x="940" y="190" width="150" height="60" rx="10" stroke="#34D399" fill="#142B32"/>
<text xml:space="preserve" class="h mono" x="1015.0" y="217.0" text-anchor="middle">main</text>
<text xml:space="preserve" class="t" x="1015.0" y="234.0" text-anchor="middle">tested · reviewed</text>
</g>
<g class="e d3"><path d="M171,220 H200" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d4"><path d="M268,220 H288" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d9"><path d="M846,220 H855" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d10"><path d="M923,220 H938" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d11"><text xml:space="preserve" class="s" x="560" y="345" text-anchor="middle">Blocked work escalates:  Developer / Reviewer / Integrator  →  Architect  →  Product Owner</text></g>
</svg>
