<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="'AF Sans', sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E63B26"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#F7941D"/></linearGradient>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F4695A"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22C55E"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FABA6A"/></marker><marker id="m-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F7941D"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker>
    <style><![CDATA[
      @font-face { font-family: 'AF Display'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'AF Sans'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }

      .title { font-family: 'AF Display', sans-serif; font-size: 26px; fill: #FFFFFF; }
      .role  { font-family: 'AF Display', sans-serif; font-size: 12px; letter-spacing: .3px; }
      .num   { font-family: 'AF Display', sans-serif; font-size: 20px; fill: #FFFFFF; }
      .sub   { font-size: 17px; fill: #9CA3AF; }
      .ph    { font-weight: 600; font-size: 18px; fill: #FFFFFF; }
      .h     { font-weight: 600; font-size: 15px; fill: #FFFFFF; }
      .t     { font-size: 13.5px; fill: #D8DAE8; }
      .s     { font-size: 13px; fill: #9CA3AF; }
      .cap   { font-size: 11px; letter-spacing: 1.5px; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .sys   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

      .n { opacity: 0; transform: translateY(8px); animation: rise .45s cubic-bezier(.2,.8,.3,1) forwards; }
      .e { opacity: 0; animation: f .4s ease forwards; }
      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .ants { stroke-dasharray: 8 6; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.7s}
      .d5{animation-delay:.9s} .d6{animation-delay:1.1s} .d7{animation-delay:1.3s} .d8{animation-delay:1.5s}
      .d9{animation-delay:1.7s} .d10{animation-delay:1.9s} .d11{animation-delay:2.1s} .d12{animation-delay:2.3s}

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .n, .e { opacity: 1 !important; animation: none !important; transform: none !important; }
        .flow, .ants, .pulse { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect x="1" y="1" width="1118" height="398" rx="18" fill="#080A24" stroke="#2E3372" stroke-width="1.5"/>
  <g class="n d1"><text xml:space="preserve" class="title" x="560" y="54" text-anchor="middle">You approve twice. The agents do the rest.</text><rect x="490" y="70" width="140" height="3" rx="1.5" fill="url(#brand)"/><text xml:space="preserve" class="sub" x="560" y="100" text-anchor="middle">Two product-owner gates. Everything between them runs on its own.</text></g>
  <g transform="translate(0 24)">
<g class="n d2">
<rect x="24" y="184" width="146" height="64" rx="10" fill="#1A1E4A" stroke="#F7941D" stroke-width="1.5"/>
<text xml:space="preserve" class="role" x="97.0" y="213.0" text-anchor="middle" fill="#FFFFFF">Product Owner</text>
<text xml:space="preserve" class="s" x="97.0" y="231.0" text-anchor="middle">feature request</text>
</g>
<g class="n d3"><circle cx="232" cy="216" r="32" fill="#1A1E4A" stroke="url(#brand)" stroke-width="3"/><circle class="pulse" cx="232" cy="216" r="39" fill="none" stroke="#F7941D" stroke-opacity=".5" stroke-width="1.5"/><text xml:space="preserve" class="cap" x="232" y="209" text-anchor="middle" fill="#FABA6A">GATE</text><text xml:space="preserve" class="num" x="232" y="231" text-anchor="middle">1</text></g>
<g class="n d3"><text xml:space="preserve" class="s" x="232" y="308" text-anchor="middle">approve spec</text></g>
<g class="n d9"><circle cx="921" cy="216" r="32" fill="#1A1E4A" stroke="url(#brand)" stroke-width="3"/><circle class="pulse" cx="921" cy="216" r="39" fill="none" stroke="#F7941D" stroke-opacity=".5" stroke-width="1.5"/><text xml:space="preserve" class="cap" x="921" y="209" text-anchor="middle" fill="#FABA6A">GATE</text><text xml:space="preserve" class="num" x="921" y="231" text-anchor="middle">5</text></g>
<g class="n d9"><text xml:space="preserve" class="s" x="921" y="308" text-anchor="middle">approve merge</text></g>
<g class="n d4"><rect class="ants" x="290" y="134" width="588" height="152" rx="16" fill="#0F1340" stroke="#3B82F6" stroke-opacity=".55" stroke-width="1.5"/><text xml:space="preserve" class="s" x="584" y="160" text-anchor="middle" letter-spacing=".6">AUTONOMOUS  ·  agents stop and ask only when the rules say they must</text></g>
<g class="n d5">
<rect x="304" y="188" width="104" height="56" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="318" y="188" width="76" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="role" x="356.0" y="221.0" text-anchor="middle" fill="#F7941D">Planner</text>
</g>
<g class="n d5"><text xml:space="preserve" class="s" x="356.0" y="268" text-anchor="middle" fill="#9CA3AF">spec + tasks</text></g>
<g class="e d6"><path d="M409,216 H417" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d5">
<rect x="418" y="188" width="104" height="56" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="432" y="188" width="76" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="role" x="470.0" y="221.0" text-anchor="middle" fill="#F7941D">Architect</text>
</g>
<g class="n d5"><text xml:space="preserve" class="s" x="470.0" y="268" text-anchor="middle" fill="#3B82F6">design · Gate 2</text></g>
<g class="e d6"><path d="M523,216 H531" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d6">
<rect x="532" y="188" width="104" height="56" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="546" y="188" width="76" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="role" x="584.0" y="221.0" text-anchor="middle" fill="#F7941D">Developer</text>
</g>
<g class="n d6"><text xml:space="preserve" class="s" x="584.0" y="268" text-anchor="middle" fill="#9CA3AF">builds · TDD</text></g>
<g class="e d6"><path d="M637,216 H645" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d6">
<rect x="646" y="188" width="104" height="56" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="660" y="188" width="76" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="role" x="698.0" y="221.0" text-anchor="middle" fill="#F7941D">Reviewer</text>
</g>
<g class="n d6"><text xml:space="preserve" class="s" x="698.0" y="268" text-anchor="middle" fill="#3B82F6">Gate 3</text></g>
<g class="e d6"><path d="M751,216 H759" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="n d7">
<rect x="760" y="188" width="104" height="56" rx="10" fill="#1A1E4A" stroke="#2E3372" stroke-width="1.5"/>
<rect x="774" y="188" width="76" height="2.5" rx="1" fill="#F7941D"/>
<text xml:space="preserve" class="role" x="812.0" y="221.0" text-anchor="middle" fill="#F7941D">Integration</text>
</g>
<g class="n d7"><text xml:space="preserve" class="s" x="812.0" y="268" text-anchor="middle" fill="#3B82F6">Gate 4</text></g>
<g class="n d10">
<rect x="975" y="184" width="121" height="64" rx="10" fill="#1A1E4A" stroke="#22C55E" stroke-width="1.5"/>
<text xml:space="preserve" class="h mono" x="1035.5" y="213.0" text-anchor="middle" fill="#FFFFFF">main</text>
<text xml:space="preserve" class="s" x="1035.5" y="231.0" text-anchor="middle">tested · reviewed</text>
</g>
<g class="e d3"><path d="M171,216 H197" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d4"><path d="M272,216 H288" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d9"><path d="M879,216 H887" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#m-g)"/></g>
<g class="e d10"><path d="M961,216 H973" fill="none" stroke="#22C55E" stroke-width="1.6" marker-end="url(#m-ok)"/></g>
<g class="n d11"><text xml:space="preserve" class="s" x="560" y="346" text-anchor="middle">Blocked work escalates:  Developer / Reviewer / Integrator  <tspan class="sys">→</tspan>  Architect  <tspan class="sys">→</tspan>  Product Owner</text></g>
  </g>
</svg>
